# Pool of narrative templates to sample from (see load_templates / sample_template)
# Each entry is a cv_template: a structural guide for the personal statement.
- |
  [Introduction]
  Begin with a compelling opening that captures the reader's attention and introduces the candidate's professional identity.

  [Professional Background]
  Detail the candidate's relevant work experience, highlighting key achievements and responsibilities that demonstrate their expertise in the field.

  [Skills and Competencies]
  Outline the candidate's core skills and competencies, emphasizing those that are most relevant to the job role they are applying for.

  [Career Goals]
  Discuss the candidate's career aspirations and how they align with the position they are seeking, showcasing their motivation and commitment to professional growth.

  [Conclusion]
  Conclude with a strong closing statement that reinforces the candidate's suitability for the role and leaves a lasting impression on the reader.
- |
  [Achievement Hook]
  Open with the candidate's most impressive concrete achievement to immediately establish credibility.

  [Context and Expertise]
  Explain the professional journey and expertise that made this achievement possible, weaving in relevant experience.

  [Breadth of Skills]
  Broaden the picture with the candidate's wider skill set and how it complements their core strength.

  [Forward Vision]
  Connect past success to the target role, describing what the candidate aims to contribute and achieve next.
- |
  [Personal Motivation]
  Start with the personal story or conviction that drew the candidate to their profession.

  [Turning Points]
  Trace one or two pivotal moments in the candidate's career, tying their qualifications and skills to these experiences.

  [Present Strengths]
  Summarize the mature skill set and expertise the candidate offers today.

  [Alignment with the Role]
  Close by linking the candidate's motivation and strengths to the specific position and organization.
- |
  [Professional Identity]
  Define the candidate in one crisp sentence: role, specialization, and years of experience.

  [Evidence]
  Support this identity with two or three concrete proof points drawn from the candidate's background and achievements.

  [Working Style]
  Characterize how the candidate works — their approach, values, and collaboration style — grounded in their skills.

  [The Ask]
  End with a confident statement of what the candidate seeks in the role and why the match benefits both sides.
- |
  [Future Ambition]
  Open with where the candidate is headed: the professional ambition that drives them.

  [Track Record]
  Work backwards, showing how their experience and achievements form a trajectory toward this ambition.

  [Toolkit]
  Present the skills and competencies the candidate brings along that trajectory.

  [Why This Role]
  Conclude by explaining why the target position is the natural next step on this path.
