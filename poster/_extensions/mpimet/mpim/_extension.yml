title: LMU/MCML layouts for quarto basd on MPIM layouts by Tobias Kölling
author: Leonhard Kestel
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    revealjs:
      theme: [slides.scss]
      width: 1245
      height: 700
      transition: slide
      slide-number: true
      code-background: true
      logo: LMU_Logo_RGB_InvertiertSchwarz.png
      chalkboard:
        buttons: true
      navigation-mode: linear
      auto-stretch: true
      center: true
      resources:
        - LMU_Logo_RGB_FlaechigGruen.png
        - LMU_Logo_RGB_InvertiertGruen.png
        - LMU_Logo_RGB_InvertiertSchwarz.png
        - LMU_Logo_RGB_InvertiertWeiss.png
        - MCML_Logo_RGB_black.png
        - MCML_Logo_RGB_white.png
      filters:
        - file-dependencies.lua
    html:
      toc: false
      theme: [poster.scss]
      page-layout: custom
      template-partials:
        - title-block.html
      filters:
        - file-dependencies.lua
        - mpim-title-filter.lua
  filters:
    - mpim-title-filter.lua
