[project]
name = "latent-intervention-cu124"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "latent-intervention[dev]",
    "torch==2.6.0",
    "langvae==0.6.13",
    "transformers==4.48.0",
]

[tool.uv]
# Deliberate GPU-host compatibility override. The root uv.lock is unchanged.
override-dependencies = ["torch==2.6.0"]

[tool.uv.sources]
latent-intervention = { path = "../..", editable = true }
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
