# One supported method; 768D is the lead model, 256D is a secondary result.
dimensions: [768, 256]
seed: 42
threads: 1
validation_fraction: 0.2
split_seed: 42
audit_split_seed: 20261007
protected_columns: [P, L, H, A]
max_epochs: 500
patience: 30
warmup_epochs: 200
warmup_patience: 20
batch_size: 32
learning_rate: 0.0003
weight_decay: 0.00001
support_bank_size: 128
semantic_tolerance: 0.15
hidden_dim: 128
state_embed_dim: 16
loss:
  factual: 1.0
  movement: 0.1
  support: 0.05
  identity: 1.0
  radial: 0.1
  entropy: 0.0
probe:
  max_epochs: 150
  patience: 15
  batch_size: 128
  guide_lr: 0.003
  auditor_lr: 0.0003
  auditor_hidden: [96, 64]
  auditor_skip: true
  auditor_warm_start: true
evaluation_samples: 64
