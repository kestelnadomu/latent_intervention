# Decode the edits of the five other renderers with the 768-D Gemma 3 270M decoder, and of all
# six with the true target states (see target_states).
# The package evaluation (package-v1) decoded the state flow only. Deployment setting as there:
# S1, rho trained and tested with psi(z), seed 0, each test unit under its own do(O = k).
# Inputs, SCM, reader and run report come from the base config; the decoder export and the
# references from the package-v1 bundle. Renderer fits are pinned by file and checksum; each
# replay must also reproduce the run report's cosine and distance. The bundle also holds the
# unedited phi(x) of the same units (set "factual"), whose decoding is scored against x.
format_version: 1
base: configs/text_realizer_package_eval.yaml
source_bundle: models/talent_motivation/text-realizer-evaluation/package-v1
width: 768
decoder: 768-270m
# the simulation's true target state of every unit under its own do(O = k): all six renderers
# (the state flow too) are also decoded conditioned on it instead of the operator's draw
target_states:
  path: data/sim_talent_motivation/sim_data_counterfactual.csv
  sha256: 2e6524bd830dd0b4ab392fd31c63d5210eec3a02a8edea8f53c63001030841fd
renderers:
  editor:
    path: models/latent_lab/rho-S1-editor-psi-seed0-0d3750666c784db0.pt
    sha256: f4c828dcdd1a4f501a6c1485c8b359ce95a26bd2788d582bdef7115672105d9d
  ot_editor:
    path: models/latent_lab/rho-S1-ot_editor-psi-seed0-bf1ad04f148b3cfa.pt
    sha256: 3f48d543e44677d494dd207bf33116e7dfedaf86d1c94da874ecef655776938e
  ot_flow:
