[project]
name = "latent-intervention-text-realizer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.6.0",
    "transformers==4.57.6",
    "sentence-transformers==5.1.2",
    "peft==0.17.1",
    "accelerate==1.10.1",
    "huggingface-hub==0.36.2",
    "numpy>=2.0,<3",
    "pandas>=2.0,<3",
    "pyyaml==6.0.3",
    "safetensors>=0.4.3",
    "sentencepiece==0.2.1",
    "rapidfuzz==3.14.1",
    "sacrebleu==2.5.1",
    "pytest>=8,<9",
    "black==25.9.0",
    "ruff==0.14.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
