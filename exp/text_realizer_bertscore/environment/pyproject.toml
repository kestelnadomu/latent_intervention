[project]
name = "latent-intervention-cv-bertscore"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "bert-score==0.3.13",
    "torch==2.6.0",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pyyaml==6.0.3",
    "pytest==8.4.2",
    "ruff==0.14.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
