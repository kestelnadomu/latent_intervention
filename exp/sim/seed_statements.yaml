  Having derived from a family that has continuously been driven by business has heavily prompted my decision to pursue Business Economics at university. Growing up, I was surrounded by several family members who owned their own businesses, and despite how diverse each market was from one another, they were achieving their ambitions and this is something I have always admired. Choosing to continue my pursuit of studying Business Economics by undergoing a foundation year, has not only broadened my knowledge of the subject at hand but, has augmented my interest and desire to study this topic in greater detail. Particularly, I have enjoyed my study of international business whereby I developed an understanding of how businesses monitor organizational performance.

  Gaining first-hand experience of the study of Business has allowed me to identify and comprehend the way in which businesses use branding strategies to gain consumers. Red and yellow are common colours throughout the food industry as they both engross the attention of potential consumers, whilst psychologically stimulating an appetite. My study of Politics has enabled me to comprehend the complexity of current affairs such as Brexit. Through my assigned study of the European Union, this has enabled me to understand how the UK benefitted for being a member of the European Union. However, leaving the EU may decrease the amount of foreign direct investment (FDI) within the country, due to the increase in tariffs for international trade and globalization. Throughout my academic experience, irrespective of the subject of business, I have maintained a liking for Mathematics, hence, my desire to study a course which incorporates this.

  A book called 'Why Rich Countries Got Rich... and Why Poor Countries Stay Poor' by Erik S. Reinert, a well-known individual in the field of economics, focuses on the ways in which economically developed countries have remained and continued developing through investment and despite various efforts applied how poor countries stay LIC's. A key feature of this book is that Reinert tends to focus on economic history, and throughout economics such as stock trading, this is an underlying denominator in being successful. Besides furthering my knowledge of Business Economics, I believe that undergoing a foundation year has been highly beneficial. From learning how to Harvard reference a variety of academic sources, to learning how to submit assignments, conducting a dissertation on the effects of China's global manufacturing dominance, to creating group presentations. I believe that I have not only grown as a student but as an individual. I consider myself to be determined, well-organized, and a dedicated worker. By successfully completing a foundation year at the University of Greenwich, this has enabled my decision to pursue business economics at an advanced level. My desire to continue my pursuit of studying Business Economics has been reflected through attending open days at Kingston University, and the University of Westminster. Though having previously encountered university life, I believe that undergoing a foundation year has not only expanded my knowledge within the subject area but, has allowed me to become more independent, develop my ability to work under pressure and obtain skills required to encounter my first official year at university.

# Source: https://universitycompare.com/personal-statement-examples/biology/statement-2
- |
  From the time of the Black Plague to the current crisis regarding the Zika virus, humanity has always been on the quest to find the best cures for fatal diseases. The Zika virus can bring insight into the dark matter of human development as it can selectively infect and kill cancerous cells in the glioblastoma through the complex process of apoptosis. It is this drive for innovative research and thinking that has led me to have a great interest in Biology and the human body, which is why I want to read Biochemistry at university. Our thoughts, actions and behaviours are governed by the brain's ability to process information, and I am fascinated by how the disruption of these particular processes can result in a variety of mental illnesses. As a woman of faith, I hold dear the saying 'Every disease has a cure'. This quote gives me every hope and determination that, with enough perseverance and time, progress can be made in our understanding of curing diseases. As an aspiring biochemical scientist, I am very much looking forward to every aspect university has to offer in developing my skills both personally and academically.

  This is why I studied Psychology alongside Chemistry, which has taught me the importance of analytical thinking, and data analyses, which I believe are highly valuable skills for research. Studying Biology has enabled me to have an insight into diverse topics such as the basic cellular processes to complex bodily systems. One topic, which sparked my intrigue, was the role of mutations in causing life-changing illnesses. For example, Sickle Cell anaemia is a genetic disease that occurs as a natural mutation of the haemoglobin gene resulting in a number of symptoms such as dactylitis and splenic sequestration. Understanding the relationship between the structure of the human body and disease further intrigued me to research beyond the A level syllabus. By studying these three subjects it has allowed me to become more resourceful, particularly due to the effective time-management required to study these subjects alongside working part time, all of which I believe are critical to my future personal development as a scientist.

  Furthermore, I understand that commitment, patience and technical ability are key skills for succeeding in this course, which is why work experience is valuable. Thus, to better grasp what a Biochemistry degree would entail, I arranged a placement at UCB where I shadowed PhD students and consultants. Observing groundbreaking clinical laboratory work and research, gave me the opportunity to understand the important role scientists have in diagnosing and treating diseases. Understanding the synthesis behind the creation of Aspirin and being able to have the opportunity to produce this drug enabled me to appreciate the complex nature and the accuracy behind this procedure. I also developed my communication skills by producing and displaying a presentation based upon medical research to professionals, helping me gain a greater insight into the industry. Beyond the academic field, I have completed the Duke of Edinburgh Award at the Bronze level, illustrating my dedication to completing tasks as well as improving upon my teamwork and gaining valuable interpersonal skills. Also, volunteering at a charity shop for 6 months and working part time at Legoland have again taught me the importance of prioritizing my time for both work and study. Photography is what I find most fascinating due to how quickly a moment can be captured and saved for generations. An image can be interpreted in so many diverse ways and evoke a number of emotions in a person. Therefore, I would love to have the opportunity to further continue this passion at university by joining a photography society. Furthermore, it can help benefit my degree choice as I have gained meticulous attention to detail and can produce highly accurate work when under pressure, which has enhanced my laboratory skills.

# Source: https://universitycompare.com/personal-statement-examples/history/statement-2
- |
  History is such a diverse subject. I find it fascinating because there are thousands of events, spanning thousands of years and hundreds of countries to discover. For this reason, there is always new knowledge to gain and new stories to be told. Not only does history enable discovery of past events and attitudes but it can be interpreted in many ways. Reading 'The Historian at Work' by John Cannon opened my eyes to the diversification of history as Cannon wrote that 'all history is, in essence, the product of the historian's mind.' This inspired me to look at events of history in a different way because the view of an event can be completely changed by analysing it with a different mindset. For example, Henry VIII is often viewed as an aggressive ruler who initiated unnecessary wars. However, it is interesting to consider this from the alternative view of his advisors and question whether this was a reflection of Henry's own beliefs or those of his ministers. Overall, studying history at university would be beneficial because not only would I be able to study a subject that I love, but it would enable me to gain and develop skills such as critical thinking which are useful within different industries.

  Learning about Nazi Germany as part of my A-Level history course sparked my interest in discovering how the other involved countries prepared for war. As a result, I visited the Churchill War Rooms which gave an insight into how Britain prepared for and conducted the war. I found it fascinating that the majority of the work towards organising the combat and structure of the British troops took place in just a few underground rooms in London. Visiting the area in which this would have taken place gave me an understanding of the atmosphere and tension that would have occurred that I would not have otherwise experienced. Following this, I read the article 'The War Department in World War II' by John D. Millett from 'The American Political Science Review' whereby I learnt how America mobilised for war and built more military equipment than Germany and Japan despite being, initially, largely unprepared. Studying English Literature has enabled me to develop a better understanding for the importance of history. History is essential in understanding why authors wrote how they did. Without historical knowledge, understanding texts written in previous eras would not be possible. An understanding of the economic and social situation of the Victorian era proves essential when studying Robert Browning's poetry. This is because the social disruption that features extensively in his writing reflects the changing attitudes and beliefs of the Victorian period in which he wrote.

  Undertaking an EPQ has allowed me to channel my enjoyment of analysing, discussing, and deploying historical evidence into a topic of my interest: Jack the Ripper. I chose to research Jack the Ripper because it was a specific topic within history that intrigued me but that I had never had the chance to study. It was also different to aspects of history I have studied before as I looked at popular culture's effect on historical interpretations: an interesting perspective that uncovers different outlooks of history that you don't otherwise learn about, such as its presentation in film and tourism. It was also an opportunity to expand on and develop the critical thinking and analytical skills that are essential when studying history, especially at a degree level. Being a member of the history prefect team has helped me develop my communication, teamwork, and organisation skills. These skills are crucial to collaborate successfully on displays and assemblies to ensure all members of the team complete tasks effectively and efficiently. My roles in classroom attachment and as a peer mentor have enabled me to develop these skills further as they gave me the opportunity to experience working with and sharing my love of history with a range of ages and personalities.
