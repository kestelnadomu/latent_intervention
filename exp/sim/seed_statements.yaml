  As India's commercial fortunes rise, the field of Corporate Social Responsibility presents an opportunity for the betterment of the individuals and the nation as a whole. It is one of the key components in today's business environment and has the potential of having a prominent impact on the Indian social fabric. Having an administrative and protective nature, this field combines my interests of managing people and resources and making a positive impact on society. It also opens a window for working in a challenging and creative line. Therefore, I wish to apply for a law and business degree which will provide a base for a career in Corporate Social Responsibility. The British educational, legal and financial organisations have been the cornerstones of all premium institutions globally and are highly valued and recognised. Not only are they deep-rooted in culture and tradition, but they have also been a beacon of prosperity and upliftment for the rest of the world. In addition, the Indian legal system has been inherited from the British colonisation and various legislations introduced by them are still in force. Thus, an education from a university in the UK will ensure a sound foundation that will not only help build my future but also help me build a better future for my country; a peaceful and equal society that is void of any prejudice or intolerance.

  I have been fortunate enough to have received an education in one of the top schools in the country and have grown up with the belief that education is the only way to understand and fight the problems plaguing our society. The ethos of my school is reflected in its motto of "Vasudhaiva Kutumbakam", which means that 'the world is a family'. This guiding principle of international brotherhood has instilled in me a sense of justice and tolerance with a global and inclusive approach towards life. My accomplishments have been special in their own right - a 'Prefect', a house captain, an awardee of 'Excellence in English and International Understanding' and a member of the Model United Nations, these are a few that I mention here. I have participated in debates and discussions over the 'Drachma Dilemma' and gender equality from an economic, psychological and business point of view at various forums. All the above-mentioned feats and accomplishments might seem modest when viewed in the larger scheme of things, but they have given me a strong appreciation for policy and polity. They have also provided me with the determination to lead and achieve things and the ability to solve problems, to take charge, and most of all to be imaginative and innovative.

  I come from a big family where I have been encouraged to express myself creatively and maturely. My father is my greatest inspiration. He has taught me to be bold and fearless, yet be compassionate and caring. I have been a member of two cultural exchange programmes - one to Spain and France and the other to Japan. I have also been a part of various non-government organisations to help educate the handicapped, write examinations for the blind and organise blood donation camps. These experiences have given me a strong appreciation for policy and polity. They have also provided me with the determination to lead and achieve things and the ability to solve problems, to take charge, and most of all to be imaginative and innovative. It is with this experience that I now choose the direction that my life should take. As a diligent and determined individual, I feel I will be capable and ready to work as a force for greater good in building a just, fair and equitable society for the succeeding generations to come.

# Source: https://universitycompare.com/personal-statement-examples/engineering/statement-2
- |
  The ultimate basis of engineering is creating something for the purpose of enhancing life, whether that be through easing the difficulty involved in a task, reducing the time required, or minimising the necessary cost. An aspect of engineering which certainly achieves this, and excites me is 'bioglass 45S5'. I'm intrigued by a synthetic material's being so receptive to human tissue that bone can chemically bond with it. The possible applications for this are staggering, and benefit people on an individual level. I find the prospect of working on projects of this nature, with applications so profound, not only exciting but also fulfilling. Hence my applying for this degree. A favourite book at present is 'The Essential Engineer' by Henry Petroski. It raises the issue of confusing science with engineering, and argues that, whilst the former is elemental, more focus ought to be paid to the latter, should we want to solve global problems sooner. I agree to an extent, but think that the distinction is somewhat artificial, as they cross fertilise. The practical application of a scientific discovery can catalyse future scientific research. For example, following the use of x-rays for clinical purposes, the harmful effect of radiation exposure was observed, prompting further research into other, safer, methods of medical imaging, such as ultrasound and MRI scans. An ambition is to go onto research; to be at the forefront of innovation, where I would be not only researching as a scientist, but also applying this research as an engineer.

  I enjoy each of my A-Level subjects, but I have particularly liked the overlap between them. I am seeing Maths as the language in which Physics and Chemistry are expressed. I really enjoy getting to the root of a systematic problem, and solving it with the creative application of fundamental principles. In my chosen degree, I look forward to working in a field which has an interdisciplinary breadth, requiring an equal input from Chemistry, Maths and Physics.

  To gain an insight into engineering, I found courses run by the Smallpeice Trust. I was on the winning team in each of the three I attended. The first, when in year 8, was a simple design-build project for a remote control vehicle. As simple as it was, I see with hindsight that it encapsulated the essence of engineering: selecting materials and methods to achieve a desired end within a budget of time, cost and risk. The second course, in Structural Engineering, required a bridge to be built. I had a head start here, as I had made one when I was eight years old. This was a venture with my grandfather: we built a two metre Warren truss bridge from MDF offcuts, which I could walk across. Last summer's course at Plymouth University focussed on naval engineering; a field new to me. Much of the technical side of it involved hull design-altering ballast and chining to result in desired trim and freeboard. However, upon reflection, I see clearly that the greatest limitation wasn't in design, but in materials- the balsa wood was buoyant and flexible, but absorbed water, while the EVA adhesive set quickly and bonded well, but was dense, leading to instability. The use of something like a styrene-acrylic polymer coating would not only have maintained the advantages of the balsa and EVA, but also provided water-repellency and decreased drag. My interest in engineering spreads beyond academia, and has a large role in my activities outside of school. I am, and have been for a while, an enthusiastic cider maker. What I enjoy most about it is not so much the product, as the process involved; refining steps and redesigning equipment to increase yield and ensure the purest cider. In doing so, I designed and constructed a press, from sleepers and coach bolts, which incorporated a car jack to extract the juice from over 100kg of apples. Testament to the engineering, it has gone on to press three seasons' worth, obtaining roughly 600ml juice for each kilo pressed.

