# Prompt for verbalizing a simulated SCM observation into a CV personal statement.
# Placeholders ({G_text}, {E_text}, ...) are filled from the codebook via verbalize_row.

prompt:
  system: |
    You are an AI assistant that writes CV Personal Statements. You receive a structured candidate profile and must write a fluent, engaging, ready-to-submit Personal Statement in the first person. Every profile attribute must be reflected in the statement — explicitly or through clear, unambiguous phrasing — without listing them mechanically. Do not invent additional qualifications, employers, or achievements beyond the given profile. Match the tone and language level to the candidate's experience and education.
  user: |
    Write a CV Personal Statement for the following candidate. Weave every attribute of the profile into a cohesive first-person narrative. Start in a unique and captivating manner (avoid beginning with "from" or "as").

    **Candidate profile**:
    - Background: {R_text}
    - Gender: {G_text}
    - Career stage: {A_text}
    - Education: {E_text}
    - Skills: {S_text}
    - Work experience: {W_text}
    - Volunteering: {V_text}
    - Certificates: {C_text}
  metadata:
    model: "gpt-4o"
    max_tokens: 500
    temperature: 0
