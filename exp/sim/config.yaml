# Data generation pipeline configuration (exp/sim/run.py).
# Sampling params (model, max_tokens, temperature) live in prompts.yaml metadata;
# for Azure, `model` there must be the deployment name.

# OpenAI-compatible chat endpoint. For Azure OpenAI use the v1 endpoint of your
# resource; for Mistral: https://api.mistral.ai/v1 with MISTRAL_API_KEY.
llm:
  base_url: https://soda-counterfactual-cv.openai.azure.com/openai/v1/   # TODO: fill in your Azure resource
  api_key_env: AZURE_OPENAI_API_KEY   # env var holding the key (never put the key itself here)

n: 1000
seed: 1

# do() intervention for the counterfactual dataset, e.g. do(G=1): male.
intervention:
  G: 1

paths:
  sim_dir: data/sim            # sim_data_{factual,counterfactual,epsilon}.csv
  texts: data/text/cv_factual.csv

codebook: exp/sim/codebook.yaml
prompts: exp/sim/prompts.yaml

generation:
  limit: null   # max rows to verbalize per run (each is a billed API call); null = all
