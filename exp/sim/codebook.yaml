# Codebook: maps each SCM column level to a natural-language phrase used to
# verbalize simulated rows into CV text (placeholders {R_text}, {G_text}, ...).
# Q is the downstream outcome and is deliberately absent.
#
# NOTE: the semantic reading of each node (R = ethnicity, A = age, etc.) is a
# working draft — review and adjust the phrases to your intended scenario.

R:
  0: "of Western European descent"
  1: "of Sub-Saharan African descent"
  2: "of East Asian descent"
  3: "of Middle Eastern descent"

G:
  0: "female"
  1: "male"

A:
  0: "at an early career stage, in their mid-20s"
  1: "mid-career, in their late 30s"
  2: "at a late career stage, in their mid-50s"

E:
  0: "no formal educational degree"
  1: "a secondary school diploma"
  2: "a bachelor's degree"
  3: "a master's degree"

S:
  0: "basic proficiency in the core skills of the field"
  1: "solid, demonstrable professional skills"
  2: "an outstanding, expert-level skill set"

W:
  0: "little to no prior work experience"
  1: "several years of relevant work experience"
  2: "extensive, long-standing work experience"

V:
  0: "no volunteering activities"
  1: "active volunteering engagement alongside their profession"

C:
  0: "no additional professional certificates"
  1: "additional professional certificates in their field"
