# Codebook: level semantics of the talent-SFM columns (exp/sim/talent_sfm.py).
# Y (qualification) is the downstream outcome and is deliberately absent.
#
# columns:  {column: {level index: phrase}} for every verbalized column
#           (schema.columns + schema.auxiliary minus hidden).
# labels:   display name per column in the candidate information list.
# hidden:   schema columns that are decoded but never verbalized.
# bins:     numeric ranges; a concrete value is sampled inside the row's bin.
# choices:  per-level option lists; one option is picked by the render-plan
#           quantile, so X and X' take the same position in the list.
# evidence: columns that are never stated as facts. Their level is rendered as
#           behavioural writing guidance in the {evidence_guidance} prompt block
#           (show, don't tell). Low levels are modest, never negative.
# forbidden_terms: evaluative trait words the text must not use (inlined in the
#           prompt as {forbidden_terms}; reported by validate-pairs).
#
# X region codes are ORDINAL BY A SIMULATED ACCESS GAP: X enters D and U
# linearly. This is a synthetic modelling choice for the fairness simulation,
# not an empirical claim about these regions. Review the region/country lists.

hidden: [T]   # talent: only inferable through the proxies P, L, H, A

columns:
  X:
    0: "Sub-Saharan Africa"
    1: "South Asia"
    2: "Latin America"
    3: "Western Europe"
  D:
    0: "Bachelor's degree"
    1: "Master's degree"
    2: "Doctorate"
  U:   # globally anchored tiers: same standing regardless of the country
    0: "a university not listed in the major global rankings"
    1: "a university ranked in the global top 500"
    2: "a university ranked in the global top 100"
  P:
    0: "1-2 projects"
    1: "3-5 projects"
    2: "6-9 projects"
  L:
    0: "gradual"
    1: "moderate"
    2: "fast"
  H:
    0: "routine"
    1: "workaround"
    2: "novel solution"
  A:
    0: "occasional"
    1: "sometimes"
    2: "go-to person"

labels:
  X: "Country of origin"
  D: "Degree"
  U: "University"
  P: "Completed projects with tangible outcomes"
  L: "Learning new skills"
  H: "Hard problems"
  A: "Colleagues"

bins:
  P:
    0: [1, 2]
    1: [3, 5]
    2: [6, 9]

choices:
  X:
    0: ["Nigeria", "Ghana", "Kenya", "Ethiopia"]
    1: ["India", "Pakistan", "Bangladesh", "Sri Lanka"]
    2: ["Brazil", "Mexico", "Colombia", "Peru"]
    3: ["Germany", "France", "the Netherlands", "Spain"]

evidence:
  L:
    0: "became comfortable with a new tool or subject area gradually, over a year or more of steady practice"
    1: "became productive with a new tool or subject area within a few months of focused effort"
    2: "became proficient in a new tool or subject area within a few weeks and soon afterwards helped others get started with it"
  H:
    0: "handles day-to-day problems reliably by following established procedures and asks for guidance on unusual cases"
    1: "found a practical workaround for a recurring problem that had been slowing their team down"
    2: "designed an original solution to a difficult problem that others had not managed to solve, which was later adopted beyond their own team"
  A:
    0: "works well alongside colleagues and shares what they know when asked"
    1: "is sometimes approached by colleagues for advice on questions in their own area"
    2: "is regularly sought out by colleagues and supervisors as the go-to person for difficult questions, including outside their own area"

forbidden_terms:
  - talent
  - talented
  - gifted
  - brilliant
  - genius
  - prodigy
  - natural ability
  - naturally gifted
  - exceptional
  - outstanding
  - extraordinary
  - highly intelligent
