[project]
name = "latent-intervention"
version = "0.1.0"
description = "Deep learning project for text generation from tabular samples"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langvae>=0.6.13",
    "openai>=2.44.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "torch>=2.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
